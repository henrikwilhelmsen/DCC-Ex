[project]
name = "mayaex-2025"
version = "0.1.0"
requires-python = ">=3.11"
description = "CLI to locate and run maya 2025"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Henrik Wilhelmsen", email = "henrik@hwanimation.tech" }
]
dependencies = ["dccex"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dccex = { workspace = true }

[project.scripts]
"maya2025" = "mayaex_2025:maya"
"mayapy2025" = "mayaex_2025:mayapy"
