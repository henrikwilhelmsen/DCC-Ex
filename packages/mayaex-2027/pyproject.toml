[project]
name = "mayaex-2027"
version = "0.1.0"
requires-python = ">=3.11"
description = "CLI to locate and run maya 2027"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Henrik Wilhelmsen", email = "henrik@hwanimation.tech" }
]
dependencies = ["dccex"]

[project.urls]
Repository = "https://git.hwanimation.tech/hwanimationtech/dccex"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dccex = { workspace = true }

[project.scripts]
"maya2027" = "mayaex_2027:maya"
"mayapy2027" = "mayaex_2027:mayapy"
