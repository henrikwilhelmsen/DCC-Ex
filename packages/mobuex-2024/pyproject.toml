[project]
name = "mobuex-2024"
version = "0.1.0"
requires-python = ">=3.11"
description = "CLI to locate and run mobu 2024"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Henrik Wilhelmsen", email = "henrik@hwanimation.tech" }
]
dependencies = ["dccex"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dccex = { workspace = true }

[project.scripts]
"mobu2024" = "mobuex_2024:mobu"
"mobupy2024" = "mobuex_2024:mobupy"
